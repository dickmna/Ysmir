[General]
bEnable=1
bDebugLogging=0

[DragonSouls]
# 0 souls is exactly the record baseline. There is no soul cap.
# Approximate spent souls adds currently known shout words to the unspent-soul count.
bApproximateSpentSoulsWithKnownWords=0
bScaleDistance=1
bScaleMagnitude=1
bScaleDuration=1
bScaleArea=1
bScaleCollisionRadius=1
bScaleVFX=1
bScaleCooldown=1
fDistancePerSoul=0.05
fMagnitudePerSoul=0.05
fDurationPerSoul=0.05
fAreaPerSoul=0.05
fCollisionRadiusPerSoul=0.05
# Common soul multiplier M = 1 + souls * fCommonMultiplierPerSoul.
fCommonMultiplierPerSoul=0.05
# Player projectile VFX uses V = 1 + fVFXGrowthRatio * (M - 1).
# Defaults: 0 souls is 1x; 100 souls is 4x; growth remains uncapped.
fVFXGrowthRatio=0.60
# True Cone uses Q = (V - 1) / 3, height = this value * Q, and
# density = 1 + (fTrueConeDensityAt4x - 1) * Q.
fTrueConeHeightAt4x=120.0
fTrueConeDensityAt4x=2.2
# Cooldown compounds by (1 - value) once per soul; no gameplay floor is imposed.
fCooldownReductionPerSoul=0.05

[ElementalFury]
bEnable=1
fChancePerElement=0.50
fElementCooldownSeconds=2.0
# Tier damage, cloak radius, shaders, and enemy VFX are authored in Ysmir.esp
# from the original Dynamic Shaders variant rather than re-invented in the DLL.

[Storm]
bEnable=1
; The storm duration continues indoors; attack cadence, searches, and strikes pause.
; Leaving an interior does not release a backlog of staggered passes.
bPauseInInteriors=1
; Preserve SCSO's unattributed/no-bounty damage behavior by default.
bBlameCaster=0
; Only the private YSMIR_StormCallProjectile launched by the player controller is patched.
; Shared Skyrim/SCSO projectile records are never rewritten at runtime.
bPatchProjectileBounds=1
bForceProjectileAlwaysDraw=1

[Storm.Gameplay]
; SCSO v3 baseline: a 12800-unit (600-magic-foot) 3D sphere.
; The cast-start snapshot scales radius, damage and duration independently.
fSearchRadius=12800.0
fDamageWord1=30.0
fDamageWord2=60.0
fDamageWord3=120.0
fDurationWord1=60.0
fDurationWord2=120.0
fDurationWord3=180.0

[Storm.Timing]
fInitialDelayMin=3.0
fInitialDelayMax=6.0
fRecastDelayMinWord1=3.0
fRecastDelayMaxWord1=6.0
fRecastDelayMinWord2=0.75
fRecastDelayMaxWord2=6.75
fRecastDelayMinWord3=0.25
fRecastDelayMaxWord3=5.25
fPassStaggerMin=0.12
fPassStaggerMax=0.35
fNoTargetRetry=0.25

[Storm.Visual]
fSpreadWord1=100.0
fSpreadWord2=300.0
fSpreadWord3=600.0
fStrikeHeight=3500.0
fTargetHeight=96.0
fImodFadeDistance=3072.0
fProjectileBoundRadius=18000.0

[TrueCone]
Enabled=1
PatchRuntimeCollision=1
PatchVisuals=1
UseVanillaNifCalibrations=1
DistanceVisualScale=1
DensityCompensation=1
DensityExcludedTokens=Cyclone,BendWill
DumpSceneTree=0
LogMatches=0
